name: Install

on:
  schedule:
      - cron: 13 12 * * 1,4

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  install-latest-cli-msrv:
    runs-on: ubuntu-latest
    steps:
    - name: Install oldest supported Rust version
      uses: actions-rs/toolchain@v1
      with:
        toolchain: "1.66"
        override: true
        components: rustc
    - name: Install
      run: cargo install zsplit-cli


  install-latest-cli:
    runs-on: ubuntu-latest
    needs: [install-latest-cli-msrv]
    if: ${{ always() && needs.install-latest-cli-msrv.result == 'failure' }}
    steps:
    - name: Install stable Rust version
      uses: actions-rs/toolchain@v1
      with:
        toolchain: "stable"
        override: true
        components: rustc
    - name: Install
      run: cargo install zsplit-cli
